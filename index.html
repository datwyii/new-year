<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогодний сюрприз 💕</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="quiz-page">
    <!-- Floating hearts animation -->
    <div class="hearts-container" id="heartsContainer"></div>

    <div class="quiz-container">
        <h1 class="quiz-title">💕 Вопрос для любимого 💕</h1>
        
        <div class="question-box">
            <p class="question-text">Кто тебя больше всего любит? 💖</p>
            
            <div class="options">
                <button class="option-btn" onclick="checkAnswer(false)">Мама</button>
                <button class="option-btn" onclick="checkAnswer(false)">Друзья</button>
                <button class="option-btn" onclick="checkAnswer(true)">Моя любимая девушка</button>
                <button class="option-btn" onclick="checkAnswer(false)">Кот</button>
            </div>
            
            <p class="error-message" id="errorMessage"></p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
